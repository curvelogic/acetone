name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs are cancelled on PR branches only. Runs on main are never
# cancelled mid-flight: every commit that lands on main should get its own CI
# verdict, even under rapid merges (acetone-cbl.8). GitHub still keeps at most
# one pending run per group, so an intermediate *queued* main run can be
# superseded by a newer one — but a *running* one always completes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # Phase 1 exit script (acetone-63m.8): the scripted end-to-end
      # session against a real repository. The remote round trip is
      # skipped in CI (E2E_REMOTE unset); it is evidenced manually.
      - name: phase 1 end-to-end script
        run: ACETONE=target/debug/acetone scripts/phase1-e2e.sh
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@acetone.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@acetone.invalid

  deny:
    name: cargo-deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check advisories licenses sources bans

  public-api:
    # The 0.2 API freeze (ADR-0046, amended in Phase 10): the acetone-core
    # façade re-export list and the full-signature surfaces of the five library
    # crates are byte-pinned in committed snapshots — the API analogue of the
    # format goldens. Any public-surface drift fails here and must be a
    # deliberate re-bless (see the failure hint).
    #
    # cargo-public-api reads rustdoc's UNSTABLE JSON, so BOTH the nightly and the
    # tool version are pinned to a combination known to parse it (rustdoc JSON
    # format_version 60). Bump all three together — nightly, tool, snapshots.
    name: public API freeze (ADR-0046)
    runs-on: ubuntu-latest
    env:
      # cargo-public-api builds rustdoc JSON with this exact nightly (matched to
      # the tool version and the committed snapshots — see ADR-0046).
      RUSTUP_TOOLCHAIN: nightly-2026-07-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: nightly-2026-07-18
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: install cargo-public-api (pinned)
        run: cargo install cargo-public-api --locked --version 0.52.0
      - name: check public-API snapshots (core façade + full signature surfaces)
        # acetone-graph/-model/-store joined the snapshot set in Phase 10
        # (acetone-7qw.20): the core façade lists re-exports by NAME only, so
        # without full-crate snapshots the entire signature surface of the
        # types those crates host was invisible to this gate — proven when
        # GraphError's #[non_exhaustive] re-blessed to an empty diff (PR #233).
        run: |
          failed=0
          for crate in acetone-core acetone-cypher acetone-graph acetone-model acetone-prolly acetone-store; do
            cargo public-api --package "${crate}" > "/tmp/${crate}-api.txt"
            if ! diff -u "crates/${crate}/public-api.txt" "/tmp/${crate}-api.txt"; then
              echo "::error::${crate} public surface changed. If intended, re-bless with scripts/bless-public-api.sh and commit the diff."
              failed=1
            fi
          done
          exit "${failed}"

  tck:
    # openCypher TCK conformance (spec §5.1: the pass rate is published
    # per commit). The job gates on the HARNESS completing — an unreadable
    # corpus or unknown step vocabulary fails — never on the pass rate
    # itself; Gate C sets the bar at the Phase 2 boundary.
    name: openCypher TCK conformance report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: run TCK harness
        # pipefail: tee must not mask a harness failure.
        run: |
          set -o pipefail
          cargo run --release -p acetone-tck --bin tck_runner -- --report tck-report.json | tee tck-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tck-conformance-report
          path: |
            tck-report.json
            tck-report.txt
